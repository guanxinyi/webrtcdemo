name: livekit-meet

services:
  livekit:
    image: livekit/livekit-server:v1.13.11
    container_name: livekit-meet-server
    # Host networking is required so that WebRTC media (UDP) can reach the
    # container with the IP advertised in ICE candidates.
    network_mode: host
    command: --config /etc/livekit/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro
    restart: unless-stopped

  token-api:
    build: ../server
    container_name: livekit-meet-token-api
    network_mode: host
    environment:
      PORT: 8080
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_HTTP_URL: http://localhost:7880
      LIVEKIT_PUBLIC_URL: "${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-secret}"
      TOKEN_TTL_SECONDS: "${TOKEN_TTL_SECONDS:-3600}"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
    depends_on:
      - livekit
    restart: unless-stopped

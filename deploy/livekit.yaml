# LiveKit server configuration for local development.
# API keys are supplied through the LIVEKIT_KEYS environment variable
# (see docker-compose.yml) instead of being committed here.

port: 7880

rtc:
  tcp_port: 7881
  # Single UDP port (UDP mux). Open 7881/tcp and 7882/udp on your firewall.
  udp_port: 7882
  # Set to true on a public server with a reachable public IP.
  use_external_ip: false

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 50

logging:
  level: info
